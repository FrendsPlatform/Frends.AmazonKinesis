name: PutRecords_test_on_main
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.AmazonKinesis.PutRecords/**'
  workflow_dispatch:

jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/linux_build_main.yml@main
    with:
      workdir: Frends.AmazonKinesis.PutRecords
      env_var_name_1: AMAZON_KINESIS_ACCESS_KEY
      env_var_name_2: AMAZON_KINESIS_SECRET_ACCES_KEY
      dotnet_version: 8.0.x
      strict_analyzers: true
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      env_var_value_1: ${{ secrets.AMAZON_KINESIS_ACCESS_KEY }}
      env_var_value_3: ${{ secrets.AMAZON_KINESIS_SECRET_ACCES_KEY }}